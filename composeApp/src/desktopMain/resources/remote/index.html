<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#181825">
<title>NuvioCodeineXO</title>
<link rel="stylesheet" href="/cuppa.css">
<script>
  // The cuppa theme: flavor (Auto follows the phone), accent and corner radius, set before first paint.
  (() => {
    const ALL_FLAVORS = ['latte', 'frappe', 'macchiato', 'mocha'];
    const RADII = { tight: 0.55, apple: 1, soft: 1.5 };
    const dark = matchMedia('(prefers-color-scheme: dark)');
    const get = (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; } };
    window.theme = {
      ACCENTS: ['rosewater', 'flamingo', 'pink', 'mauve', 'red', 'peach', 'yellow', 'green', 'teal', 'sky', 'blue', 'lavender'],
      set(key, value) { try { localStorage.setItem(key, value); } catch (_) {} this.apply(); },
      apply() {
        const flavor = get('ui-flavor', 'auto'), accent = get('ui-accent', 'lavender'), radius = get('ui-radius', 'apple');
        const shown = flavor === 'auto' ? (dark.matches ? 'macchiato' : 'latte') : (flavor === 'light' || flavor === 'latte' ? 'latte' : 'macchiato');
        const root = document.documentElement;
        ALL_FLAVORS.forEach((f) => root.classList.toggle(f, f === shown));
        root.style.setProperty('--accent', `var(--ctp-${accent})`);
        root.style.setProperty('--r-scale', RADII[radius] || 1);
        document.querySelectorAll('[data-flavor]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.flavor === flavor));
        document.querySelectorAll('[data-radius]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.radius === radius));
        document.querySelectorAll('[data-accent]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.accent === accent));
      },
    };
    theme.apply();
    dark.addEventListener('change', () => theme.apply());
  })();
</script>
<style>
  /* The remote's own pieces: the page shell, the D-pad, the player bar. Tokens only, from cuppa.css. */
  html, body { min-height: 100%; }
  body { background: transparent; /* html paints the page colour, so the blurred artwork can sit between */
    max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; overscroll-behavior: none;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right))
      calc(env(safe-area-inset-bottom) + 84px) max(16px, env(safe-area-inset-left)); min-height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { flex: 1; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { flex: none; width: 16px; height: 16px; display: grid; place-items: center; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ctp-green); }
  .status.on .spin-ring, .status:not(.on) .dot { display: none; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
  .line { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ic { width: 24px; height: 24px; fill: currentColor; flex: none; }

  /* D-pad */
  .dpad { position: relative; width: min(80vw, 55dvh, 320px); aspect-ratio: 1; border-radius: 50%; }
  .dpad button { position: absolute; display: grid; place-items: center; color: var(--ctp-subtext1); transition: color 0.15s;
    touch-action: none; user-select: none; -webkit-touch-callout: none; }
  .dpad button.pressed { color: var(--ctp-text); }
  .dpad .line { width: 36px; height: 36px; }
  .dpad .arrow { width: 34%; height: 34%; }
  .dpad .arrow.pressed::before { content: ""; position: absolute; inset: 10%; border-radius: 50%; pointer-events: none;
    background: var(--glass-sheen), var(--glass-accent); box-shadow: var(--glass-selected-rim); }
  .dpad .arrow .line { position: relative; }
  .up { top: 0; left: 33%; } .down { bottom: 0; left: 33%; } .left { left: 0; top: 33%; } .right { right: 0; top: 33%; }
  .dpad .ok { width: 38%; height: 38%; left: 31%; top: 31%; border-radius: 50%; color: var(--ctp-text); font-size: 20px; font-weight: 600;
    transition: transform 0.15s var(--ease), background-color 0.15s; }
  .dpad .ok.pressed { transform: scale(0.95); background-color: var(--glass-accent); box-shadow: var(--glass-selected-rim); }

  /* Browsing: Home's hero and rows, Search, and the sidebar as a tab bar. */
  .browse { justify-content: flex-start; align-items: stretch; gap: 22px; width: 100%; }
  .bottom-controls { position: fixed; z-index: 5; left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right)); bottom: calc(env(safe-area-inset-bottom) + 10px);
    display: flex; justify-content: center; pointer-events: none; }
  .bottom-bar { --bottom-tab-width: clamp(44px, 16vw, 60px); position: relative; display: flex; gap: 8px; }
  .tabbar, .action-pill { display: flex; gap: 2px; padding: 6px; pointer-events: auto;
    border-radius: 9999px; }
  /* Keep the tabs' space during playback so the Back pill stays in place. */
  body:has(#player:not([hidden])) .tabbar { visibility: hidden; }
  .tab { min-width: var(--bottom-tab-width); height: 52px; padding-inline: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; border-radius: 9999px; font-size: 11px; font-weight: 500; color: var(--ctp-subtext1); transition: background-color 0.2s, color 0.2s; }
  .tab :is(.line, .ic) { width: 22px; height: 22px; }
  .tab:active:not(:disabled) { background-color: var(--glass-active); }
  .playback-pill { position: absolute; bottom: 0; }
  #next-episode-pill { left: 0; }
  #skip-segment-pill { left: 50%; transform: translateX(-50%); max-width: calc(100% - 2 * (var(--bottom-tab-width) + 20px)); }
  #skip-segment { min-width: 0; font-size: 13px; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
  .pc-note { text-align: center; }

  .hero-strip, .row-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
  .hero-strip::-webkit-scrollbar, .row-scroll::-webkit-scrollbar { display: none; }
  .home-backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0;
    transition: opacity 0.35s var(--ease); }
  .home-backdrop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.25);
    filter: blur(56px) saturate(1.35); }
  body:has(#home:not([hidden])) .home-backdrop:has(img) { opacity: 0.42; }
  .latte body:has(#home:not([hidden])) .home-backdrop:has(img) { opacity: 0.29; }
  .hero-card { position: relative; flex: 0 0 100%; scroll-snap-align: start; aspect-ratio: 4 / 5; max-height: 62dvh;
    overflow: hidden; border-radius: var(--r-card); background: var(--ctp-surface0); text-align: left; }
  .hero-card img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-card .shade { position: absolute; inset: 0;
    background: linear-gradient(to top, color-mix(in srgb, var(--ctp-crust) 92%, transparent) 10%, transparent 65%); }
  .hero-card .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .hero-card .logo { max-width: 75%; max-height: 72px; object-fit: contain; object-position: left bottom; }
  .hero-card .meta-line { font-size: 13px; color: var(--ctp-subtext1); }
  .hero-card .rating { color: var(--ctp-yellow); font-weight: 700; }
  .hero-card .desc { font-size: 15px; color: var(--ctp-subtext1); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .hero-card .btn { align-self: flex-start; }

  .rows { display: flex; flex-direction: column; gap: 22px; }
  .row-title { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
  .tile { flex: none; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; text-align: left; transition: transform 0.15s var(--ease); }
  .tile:active { transform: scale(0.96); }
  .tile .art { position: relative; overflow: hidden; border-radius: calc(var(--r-ctl) + 2px); background: var(--ctp-surface0); }
  .tile .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.poster { width: 34vw; max-width: 140px; }
  .tile.poster .art { aspect-ratio: 2 / 3; }
  .tile.landscape { width: 70vw; max-width: 300px; }
  .tile.landscape .art { aspect-ratio: 16 / 9; }
  .tile .name { font-size: 13px; color: var(--ctp-subtext1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .time-left { position: absolute; top: 8px; right: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--ctp-crust) 80%, transparent); }
  .tile .resume { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 12px 10px;
    background: linear-gradient(to top, color-mix(in srgb, var(--ctp-crust) 90%, transparent), transparent); }
  .tile .resume small { display: block; font-size: 12px; font-weight: 600; color: var(--accent); }
  .tile .resume b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .bar { height: 4px; margin-top: 6px; border-radius: 9999px; background: color-mix(in srgb, var(--ctp-text) 25%, transparent); overflow: hidden; }
  .tile .bar i { display: block; height: 100%; background: var(--accent); }

  .search-box { display: flex; align-items: center; gap: 10px; height: 48px; padding-inline: 14px; border-radius: var(--r-ctl);
    color: var(--ctp-subtext0); }
  .search-box:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .search-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ctp-text); font: inherit; font-size: 17px; }
  @media (min-width: 640px) and (orientation: landscape), (min-width: 760px) {
    .hero-card { flex-basis: 100%; aspect-ratio: 21 / 9; max-height: 60dvh; }
    .tile.poster { width: 140px; }
    .tile.landscape { width: 280px; }
  }

  /* A screen slides in when the PC moves to it, so the phone follows along. */
  @keyframes view-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  main:not([hidden]) { animation: view-in 0.35s var(--ease); }

  /* Details and Sources */
  .page-bar { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; }
  .detail-hero, .stream-hero { position: relative; overflow: hidden; border-radius: var(--r-card); background: var(--ctp-surface0);
    aspect-ratio: 4 / 3; max-height: 46dvh; }
  .stream-hero { aspect-ratio: 16 / 7; }
  .detail-hero > img, .stream-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .detail-hero .shade, .stream-hero .shade { position: absolute; inset: 0;
    background: linear-gradient(to top, color-mix(in srgb, var(--ctp-crust) 92%, transparent) 8%, transparent 70%); }
  .detail-hero .info, .stream-hero .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .detail-hero .logo, .stream-hero .logo { max-width: 75%; max-height: 80px; object-fit: contain; object-position: left bottom; }
  .stream-hero .logo { max-height: 56px; }
  .meta-line { font-size: 13px; color: var(--ctp-subtext1); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .meta-line .tag { padding: 0 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--ctp-overlay0); }
  .meta-line .score b { color: var(--ctp-yellow); }
  .genres { color: var(--ctp-text); font-weight: 600; }
  .detail-actions { display: flex; gap: 10px; }
  .detail-actions .btn-filled { flex: 1; }
  .detail-actions .btn-filled .ic { width: 18px; height: 18px; }
  .episodes { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  [data-card-menu], [data-card-menu] img { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #card-menu-actions .destructive { color: var(--ctp-red); }
  #d-filler { margin-bottom: 12px; }
  .episode { display: flex; gap: 12px; text-align: left; padding: 8px; border-radius: var(--r-card); background: var(--ctp-base);
    transition: transform 0.15s var(--ease); }
  .episode:active { transform: scale(0.98); }
  .episode .thumb { position: relative; flex: none; width: 40%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--r-ctl); background: var(--ctp-surface0); }
  .episode .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .episode .thumb .blurred { filter: blur(12px); }
  .episode[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  .episode .thumb .code { position: absolute; left: 6px; bottom: 6px; padding: 1px 6px; border-radius: 6px; font-size: 12px; font-weight: 700;
    background: color-mix(in srgb, var(--ctp-crust) 80%, transparent); }
  .episode .copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .episode .copy b { font-size: 15px; }
  .episode .copy p { margin: 0; font-size: 13px; color: var(--ctp-subtext0); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .episode .copy small { font-size: 12px; color: var(--ctp-subtext0); }
  .stream-list { display: flex; flex-direction: column; gap: 10px; }
  .stream-list .addon { margin: 8px 4px 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ctp-subtext0); }
  .stream-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px 16px; border-radius: var(--r-card);
    background: var(--ctp-base); transition: transform 0.15s var(--ease); }
  .stream-card:active { transform: scale(0.98); background: var(--ctp-surface0); }
  .stream-card b { font-size: 16px; }
  .stream-card .sub { white-space: pre-line; font-size: 13px; color: var(--ctp-subtext1); }
  .stream-card .badges { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Loading: skeletons shaped like the page while it loads, spinners for actions */
  .home-skeleton, .detail-skeleton { display: flex; flex-direction: column; gap: 14px; }
  .sk-row { display: flex; gap: 12px; overflow: hidden; }
  .sk-hero { aspect-ratio: 4 / 5; max-height: 62dvh; border-radius: var(--r-card); }
  .sk-title { width: 45%; height: 20px; margin-top: 8px; }
  .sk-wide { flex: 0 0 70%; aspect-ratio: 16 / 9; }
  .sk-poster { flex: 0 0 34%; aspect-ratio: 2 / 3; }
  .sk-detail { aspect-ratio: 4 / 3; max-height: 46dvh; border-radius: var(--r-card); }
  .sk-line { height: 14px; } .sk-line.short { width: 60%; }
  .sk-button { height: 44px; }
  .sk-chip { width: 96px; height: 32px; border-radius: 9999px; }
  .sk-episode { height: 92px; border-radius: var(--r-card); }
  #details.is-loading > :not(.page-bar):not(#d-skeleton) { display: none; }
  #details:not(.is-loading) #d-skeleton { display: none; }
  .addon-loading { display: flex; align-items: center; gap: 8px; }
  .resume-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
    padding: 10px 12px; border-radius: var(--r-card); background: color-mix(in srgb, var(--ctp-base) 85%, transparent); }
  .resume-bar > span { font-size: 15px; font-weight: 600; }
  /* The switch fills the card; each side as wide as its own label, so it never runs off the screen. */
  .resume-bar .seg { display: flex; width: 100%; }
  .resume-bar .seg button { flex: 1 1 auto; min-width: 0; padding-inline: 10px; white-space: nowrap; }
  /* Source names and details often hold file names with no spaces (…WEB.H265-SUPPLY.mkv): let them wrap anywhere. */
  .stream-card, .stream { min-width: 0; max-width: 100%; }
  .stream-card b, .stream-card .sub, .stream .top, .stream .sub { overflow-wrap: anywhere; word-break: break-word; }
  .stream .top { flex-wrap: wrap; }

  /* Playing screen: artwork first, then the controls. */
  body:has(#player:not([hidden])) { height: 100dvh; }
  #player { width: 100%; min-height: 0; justify-content: flex-end; gap: 20px; }
  /* The artwork, blurred and dimmed behind the whole page. */
  .backdrop { position: fixed; inset: 0; z-index: -1; background: center / cover no-repeat var(--art, none);
    filter: blur(48px) saturate(1.2); transform: scale(1.3); opacity: 0; transition: opacity 0.5s var(--ease); }
  /* The accent over the artwork: the artwork keeps its light and shape, the accent gives it its colour. */
  .backdrop::after { content: ""; position: absolute; inset: 0; background: var(--accent); mix-blend-mode: color; opacity: 0.85; }
  body:has(#player:not([hidden])) .backdrop.on { opacity: 0.4; }
  .latte body:has(#player:not([hidden])) .backdrop.on { opacity: 0.3; }

  .hero { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--r-card);
    background: var(--ctp-surface0); box-shadow: var(--shadow-3); }
  .hero > img#art { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.5s var(--ease); }
  .hero > img#art.on { opacity: 1; }
  .hero .shade { position: absolute; inset: 0;
    background: linear-gradient(to top, color-mix(in srgb, var(--ctp-crust) 85%, transparent), transparent 60%); }
  .hero .logo { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 70%; max-height: 38%;
    object-fit: contain; filter: drop-shadow(0 2px 8px color-mix(in srgb, var(--ctp-crust) 80%, transparent)); }
  .hero-title { position: absolute; left: 16px; right: 16px; bottom: 12px; margin: 0; text-align: center; color: var(--ctp-text); }
  .meta { width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .ep-info { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .synopsis { text-align: left; color: var(--ctp-subtext1); display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 3; overflow: hidden; }
  .synopsis.open { -webkit-line-clamp: unset; }

  .controls { width: 100%; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: var(--r-card); }
  .seek { display: grid; grid-template-columns: minmax(0, 1fr); }
  .seek-times { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ctp-subtext0); font-variant-numeric: tabular-nums; }
  .transport { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: clamp(4px, 3vw, 16px); }
  #seek-back { justify-self: end; }
  .play { width: 72px; height: 72px; flex: none; border-radius: 50%; display: grid; place-items: center;
    transition: transform 0.15s var(--ease); }
  :is(.play, .skip):active:not(:disabled) { transform: scale(0.92); background-color: var(--glass-active); }
  .play .ic { width: 30px; height: 30px; }
  .skip { flex: none; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; color: var(--ctp-text);
    transition: transform 0.15s var(--ease); }
  .skip .ic { width: 30px; height: 30px; }
  .seek-step .ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .volume { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; column-gap: 10px; align-items: center; color: var(--ctp-subtext0); }
  .volume .range { grid-column: 2; min-width: 0; }
  .volume output { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }

  .tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; }
  .tool { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--ctp-subtext0); white-space: nowrap; }
  .tool > span { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%;
    color: var(--ctp-text); transition: transform 0.15s var(--ease); }
  .tool:active > span { transform: scale(0.92); background-color: var(--glass-active); }
  .tool:disabled { opacity: 0.45; }
  .tool .ic { width: 22px; height: 22px; }
  .media, .deck { width: 100%; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .media { min-height: 0; max-height: 100%; overflow-y: auto; gap: 14px; }
  .deck { flex-shrink: 0; }
  .hero { max-height: 36dvh; }

  /* ─── Responsive ─── */
  /* Small phones (iPhone SE, mini): tighter transport, the tools on two rows so the labels fit. */
  @media (max-width: 374px) {
    body { gap: 12px; }
    .play { width: 64px; height: 64px; }
    .skip { width: 44px; height: 44px; }
    .controls { padding: 12px; }
    .tools { gap: 0; }
    .tool { font-size: 10px; letter-spacing: -0.01em; }
    .tool > span { width: 40px; height: 40px; }
  }
  /* Short screens: keep the controls in view; the synopsis stays a tap away. */
  @media (max-height: 740px) {
    body { gap: 10px; }
    .synopsis { -webkit-line-clamp: 2; }
    #player, .deck { gap: 12px; }
    .media { gap: 8px; }
    .hero { max-height: 28dvh; }
    .controls { gap: 8px; padding: 12px; }
    .play { width: 60px; height: 60px; }
    .play .ic { width: 26px; height: 26px; }
    .tool > span { width: 42px; height: 42px; }
  }
  @media (max-height: 600px) and (orientation: portrait) {
    .synopsis { -webkit-line-clamp: 1; }
    .hero { max-height: 24dvh; }
  }
  /* Landscape phones and tablets: artwork on the left, controls on the right. */
  @media (min-width: 640px) and (orientation: landscape), (min-width: 760px) {
    body { max-width: 1040px; }
    #player { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 1fr); align-content: end; align-items: end; gap: 24px; }
    #player[hidden] { display: none; }
    .deck { position: sticky; top: 12px; }
    #remote { flex-direction: row; gap: 48px; }
    .sheet { width: min(100vw, 640px); }
  }
  /* Landscape phones: very little height, so the artwork shrinks and the page header gets out of the way. */
  @media (orientation: landscape) and (max-height: 500px) {
    body { gap: 10px; padding-top: calc(env(safe-area-inset-top) + 8px); }
    .hero { max-height: 46dvh; }
    .synopsis { -webkit-line-clamp: 3; }
    .controls { gap: 8px; padding: 12px; }
    .play { width: 56px; height: 56px; }
    .play .ic { width: 24px; height: 24px; }
    .skip { width: 44px; height: 44px; }
    .tool > span { width: 40px; height: 40px; }
    .deck { gap: 12px; }
    .dpad { width: min(48dvh, 300px); }
    .sheet { max-height: 94dvh; }
  }

  /* Sheets: the player's panels */
  .stream { display: flex; flex-direction: column; gap: 6px; }
  .stream .top { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .stream .sub { white-space: pre-line; font-size: 15px; color: var(--ctp-subtext1); }
  .stream[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  .stream .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .stream img { height: 18px; }
  .more { display: grid; grid-template-columns: 1fr 1fr; }
  .more .row + .row::before { display: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 6px 6px; margin: 0 2px; }
  .swatch { width: 32px; height: 32px; border-radius: 50%; background: var(--swatch); box-shadow: inset 0 0 0 1px var(--ctp-surface1); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ctp-base), 0 0 0 4px var(--ctp-text); }
  .swatch:disabled { opacity: 0.4; }
  .custom { position: relative; overflow: hidden; }
  .custom input { position: absolute; inset: 0; opacity: 0; }
  .row-stack { flex-direction: column; align-items: stretch; }
  .note { font-size: 13px; color: var(--ctp-subtext0); }
</style>
</head>

        <div class="chips"><button class="chip" data-radius="tight">Subtle</button><button class="chip" data-radius="apple">Classic</button><button class="chip" data-radius="soft">Pill</button></div></div>

<script>
  const $ = (id) => document.getElementById(id);
  let ws = null;
  let retry = 500;

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { retry = 500; setStatus(true); };
    ws.onclose = () => {
      stopDpadPress();
      $('card-menu').close();
      setStatus(false);
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 4000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.k === 'player') showPlayer(msg);
      if (msg.k === 'time') showTime(msg.position, msg.duration);
      if (msg.k === 'home') showHome(msg);
      if (msg.k === 'search') showSearch(msg);
      if (msg.k === 'route') { pcRoute = msg.route; updateView(); }
      if (msg.k === 'details') showDetails(msg);
      if (msg.k === 'streams') showStreams(msg);
      if (msg.k === 'cardMenu') showCardMenuActions(msg);
    };
  }

  function setStatus(on) {
    const status = $('status');
    status.setAttribute('aria-label', on ? 'Connected' : 'Reconnecting');
    status.classList.toggle('on', on);
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }
  const player = (type, value = 0) => send({ cmd: 'player', type, value });
  const click = (target) => send({ cmd: 'click', target });

  // ─── Sheets: native <dialog>; close with Close, a tap on the backdrop or a swipe down on the header ───
  document.querySelectorAll('dialog.sheet').forEach((sheet) => {
    sheet.addEventListener('click', (e) => { if (e.target === sheet || e.target.closest('[data-dismiss]')) sheet.close(); });
    const head = sheet.querySelector('.sheet-head');
    let startY = null;
    head.addEventListener('pointerdown', (e) => { if (!e.target.closest('button')) { startY = e.clientY; head.setPointerCapture(e.pointerId); } });
    head.addEventListener('pointermove', (e) => {
      if (startY !== null) { sheet.style.transition = 'none'; sheet.style.transform = `translateY(${Math.max(0, e.clientY - startY)}px)`; }
    });
    head.addEventListener('pointerup', (e) => {
      if (startY === null) return;
      const dragged = e.clientY - startY;
      startY = null;
      sheet.style.transition = '';
      sheet.style.transform = '';
      if (dragged > 80) sheet.close();
    });
  });
  // Opens a sheet with focus on the sheet itself, so its first item isn't outlined (the ring the list clipped).
  function present(sheet) {
    sheet.showModal();
    sheet.focus({ preventScroll: true });
    scheduleHomeHero();
  }
  let cardMenuPointerDown = false;
  let cardMenuRequest = 0;
  $('card-menu').addEventListener('pointerdown', () => { cardMenuPointerDown = true; });
  $('card-menu').addEventListener('click', (event) => {
    // Releasing the hold can send a click to the newly opened dialog.
    if (event.detail !== 0 && !cardMenuPointerDown) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
    cardMenuPointerDown = false;
  }, true);
  $('appearance-open').addEventListener('click', () => present($('appearance')));

  // The accent swatches: one per Catppuccin accent, painted with that accent.
  theme.ACCENTS.forEach((accent) => {
    const swatch = document.createElement('button');
    swatch.className = 'swatch';
    swatch.dataset.accent = accent;
    swatch.setAttribute('aria-label', accent);
    swatch.style.setProperty('--swatch', `var(--ctp-${accent})`);
    $('accents').append(swatch);
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-flavor],[data-radius],[data-accent]');
    if (!b) return;
    if (b.dataset.flavor) theme.set('ui-flavor', b.dataset.flavor);
    if (b.dataset.radius) theme.set('ui-radius', b.dataset.radius);
    if (b.dataset.accent) theme.set('ui-accent', b.dataset.accent);
  });
  theme.apply();

  // ─── The player's bar ───
  let state = { active: false };
  let draggingVolume = false;
  let draggingSeek = false;

  function showPlayer(msg) {
    const previous = state;
    state = msg;
    updateView();
    if (!msg.active) { closeSheetFromPlayer(); $('more').close(); return; }
    showMedia(msg);
    $('play-icon').setAttribute('href', msg.playing ? '#icon-pause' : '#icon-play');
    if (!draggingVolume) setRange($('volume'), msg.volume);
    $('volume-label').textContent = Math.round(Number($('volume').value) * 100) + '%';
    $('aspect').textContent = msg.aspect;
    $('chapters-item').hidden = !msg.chapters.length;
    $('skip-segment').textContent = msg.skipSegment?.label || '';
    $('player-episodes').disabled = !msg.episodes?.available;
    if (previous.active && previous.closeModalsToken !== msg.closeModalsToken) closeSheetFromPlayer();
    if (msg.p2pConsent && !previous.p2pConsent) {
      $('more').close();
      openSheet('p2pConsent');
      return;
    }
    if (!msg.p2pConsent && openPanel === 'p2pConsent') closeSheetFromPlayer();
    if (openPanel === 'subtitles' &&
        Boolean(previous.subtitles?.slots?.secondarySelected) !== Boolean(msg.subtitles.slots?.secondarySelected)) {
      subtitleLanguage = msg.subtitles.language;
      $('panel-body').scrollTop = 0;
      const chips = $('panel-body').querySelector('.subtitle-languages');
      if (chips) chips.scrollLeft = 0;
    }
    const openedEpisodeSources = msg.episodes?.streams && !previous.episodes?.streams;
    if (openedEpisodeSources && !msg.p2pConsent && openPanel !== 'episodes') {
      $('more').close();
      openSheet('episodes');
      return;
    }
    if (openPanel === 'episodes') {
      if (!msg.episodes?.available || (previous.episodeInfo && previous.episodeInfo !== msg.episodeInfo)) {
        closeSheetFromPlayer();
        return;
      }
      if (Boolean(previous.episodes?.streams) !== Boolean(msg.episodes.streams)) $('panel-body').scrollTop = 0;
    }
    if (openPanel && (!['subtitles', 'episodes'].includes(openPanel) ||
        JSON.stringify(previous[openPanel]) !== JSON.stringify(msg[openPanel]))) renderPanel();
  }

  // ─── Which screen: the player while something plays; otherwise browsing, or the D-pad when toggled on ───
  const TAB_NAMES = { home: 'Home', search: 'Search', shuffle: 'Shuffle', library: 'Library' };
  let browseTab = 'home';
  let dpadMode = false;
  let dpadPress = null;
  try { dpadMode = localStorage.getItem('nuvio_dpad') === '1'; } catch (_) {}

  // The page the PC shows; the phone follows it into a title, its sources and the player.
  let pcRoute = 'tabs';

  // A tap that moves the PC (open a title, play, pick a source) spins on what was tapped until the PC gets there.
  let busyTimer = null;
  function markBusy(node) {
    clearBusy();
    node.classList.add('busy');
    busyTimer = setTimeout(clearBusy, 12000);
  }
  function clearBusy() {
    clearTimeout(busyTimer);
    document.querySelectorAll('.busy').forEach((n) => n.classList.remove('busy'));
  }
  // Opening a title: its page shows a skeleton until the title has loaded.
  let awaitingDetails = false;
  let lastView = '';

  function setHidden(id, hidden) {
    if ($(id).hidden !== hidden) $(id).hidden = hidden;
  }

  let wasPlaying = false;
  let homeScroll = 0;
  function restoreViewScroll(id, top) {
    requestAnimationFrame(() => {
      if (!$(id).hidden) scrollTo(0, top);
    });
  }

  function updateView({ switchingTabs = false } = {}) {
    // Something is playing on the PC: the phone goes straight to the playing screen, whatever it showed.
    const playing = state.active || pcRoute === 'player';
    const enteredPlayer = playing && !wasPlaying;
    wasPlaying = playing;
    // The PC moved on: whatever was spinning has arrived.
    const view = `${playing}|${pcRoute}`;
    if (view !== lastView) { clearBusy(); $('card-menu').close(); lastView = view; }
    const browsing = !playing && !dpadMode;
    const onTabs = browsing && pcRoute === 'tabs';
    const homeVisible = onTabs && browseTab === 'home';
    const homeWasVisible = !$('home').hidden;
    if (homeWasVisible && !homeVisible) homeScroll = scrollY;
    // Pages the phone can't show (Shuffle, Library, Settings, a folder…) are driven with the D-pad.
    const pcTab = onTabs && browseTab !== 'home' && browseTab !== 'search';
    const pcPage = browsing && pcRoute === 'other';
    setHidden('player', !playing);
    setHidden('next-episode-pill', !(state.active && state.nextEpisodePlayable));
    setHidden('skip-segment-pill', !(state.active && state.skipSegment));
    setHidden('home', !homeVisible);
    setHidden('search', !(onTabs && browseTab === 'search'));
    const detailsVisible = browsing && pcRoute === 'details';
    const detailsWasHidden = $('details').hidden;
    setHidden('details', !detailsVisible);
    if (onTabs) {
      season = null;
      detailsEpisodePositioned = false;
    }
    if (detailsVisible && detailsWasHidden && !awaitingDetails && details?.name) renderEpisodes();
    setHidden('streams', !(browsing && pcRoute === 'streams'));
    const hideDpad = playing || !(dpadMode || pcTab || pcPage);
    if (hideDpad) {
      stopDpadPress();
      if (!playing && !switchingTabs && !$('remote').hidden) send({ cmd: 'exitDpad' });
    }
    setHidden('remote', hideDpad);
    $('pc-note').hidden = !(pcTab || pcPage);
    $('pc-note').textContent = pcTab ? `${TAB_NAMES[browseTab]} is open on your PC. Use the D-pad to move around.`
      : pcPage ? 'This page is open on your PC. Use the D-pad to move around.' : '';
    $('dpad-toggle').hidden = playing;
    $('dpad-toggle').setAttribute('aria-pressed', dpadMode);
    document.querySelectorAll('[data-tab]').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === browseTab));
    if (enteredPlayer) restoreViewScroll('player', 0);
    if (homeVisible && !homeWasVisible) {
      moveHomeHero(homeHeroIndex);
      restoreViewScroll('home', homeScroll);
    }
    if (homeVisible !== homeWasVisible) scheduleHomeHero();
  }

  function setDpadMode(enabled) {
    dpadMode = enabled;
    try { localStorage.setItem('nuvio_dpad', enabled ? '1' : '0'); } catch (_) {}
  }

  document.querySelectorAll('[data-tab]').forEach((tab) => tab.addEventListener('click', () => {
    const returningHome = tab.dataset.tab === 'home' && $('home').hidden;
    browseTab = tab.dataset.tab;
    setDpadMode(false);
    send({ cmd: 'tab', tab: browseTab });
    updateView({ switchingTabs: true });
    if (!returningHome) scrollTo({ top: 0 });
  }));
  $('dpad-toggle').addEventListener('click', () => {
    setDpadMode(!dpadMode);
    updateView();
  });

  // ─── Home: the hero, Continue Watching and every row, like the PC; a tap opens the title there ───
  const img = (src, className) => {
    const image = el('img', className);
    image.alt = '';
    image.draggable = false;
    image.loading = 'lazy';
    image.decoding = 'async';
    if (src) image.src = src;
    return image;
  };

  function showCardMenuActions(msg) {
    const menu = $('card-menu');
    if (!menu.open || msg.menu !== cardMenuRequest) return;
    if (!msg.actions.length) {
      menu.close();
      return;
    }
    $('card-menu-actions').replaceChildren(...msg.actions.map((action, index) => {
      const button = el('button', action.destructive ? 'row destructive' : 'row', action.label);
      button.addEventListener('click', () => {
        menu.close();
        send({ cmd: 'cardMenuAction', menu: msg.menu, action: index });
      });
      return button;
    }));
  }

  function bindCardMenu(card, onSelect, options = null) {
    card.dataset.cardMenu = '';
    if (!options) {
      card.addEventListener('contextmenu', (e) => e.preventDefault());
      card.addEventListener('click', onSelect);
      return;
    }
    card.setAttribute('aria-haspopup', 'dialog');
    let press = null;
    let menuOpened = false;

    function cancelHold() {
      if (!press) return;
      clearTimeout(press.timer);
      press = null;
    }

    function openMenu() {
      cancelHold();
      if (!card.isConnected || card.disabled) return;
      menuOpened = true;
      const menu = $('card-menu');
      if (menu.open || !ws || ws.readyState !== WebSocket.OPEN) return;
      cardMenuPointerDown = false;
      $('card-menu-title').textContent = options.title;
      const summary = $('card-menu-description');
      summary.textContent = options.description || '';
      summary.hidden = !options.description;
      $('card-menu-actions').replaceChildren(loader('Loading actions…'));
      present(menu);
      send({ cmd: 'cardMenu', menu: ++cardMenuRequest, ...options.target });
    }

    card.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button !== 0 || card.disabled) return;
      cancelHold();
      menuOpened = false;
      press = { id: e.pointerId, x: e.clientX, y: e.clientY, timer: setTimeout(openMenu, 500) };
    });
    card.addEventListener('pointermove', (e) => {
      if (press?.id === e.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelHold();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((event) => card.addEventListener(event, (e) => {
      if (press?.id === e.pointerId) cancelHold();
    }));
    card.addEventListener('contextmenu', (e) => { e.preventDefault(); openMenu(); });
    card.addEventListener('click', (e) => {
      if (menuOpened && e.detail !== 0) return;
      onSelect();
    });
  }

  function posterMenu(item, location) {
    return { title: item.name, description: item.description,
      target: { kind: 'poster', ...location, id: item.id, type: item.type } };
  }

  function heroCard(hero, index) {
    const location = { from: 'hero', item: index };
    const open = () => { markBusy(card); awaitingDetails = true; send({ cmd: 'open', ...location }); };
    const card = el('div', 'hero-card');
    card.append(img(hero.image, 'bg'), el('div', 'shade'));
    const info = el('div', 'info');
    if (hero.logo) {
      const logo = img(hero.logo, 'logo');
      logo.onerror = () => logo.replaceWith(el('div', 't-title2', hero.name));
      info.append(logo);
    } else {
      info.append(el('div', 't-title2', hero.name));
    }
    const meta = el('div', 'meta-line');
    if (hero.year) meta.append(`${hero.year}  `);
    if (Number(hero.rating) > 0) meta.append(el('span', 'rating', `IMDb ${hero.rating}`), '  ');
    if (hero.genres) meta.append(hero.genres);
    if (meta.childNodes.length) info.append(meta);
    if (hero.description) info.append(el('div', 'desc', hero.description));
    const details = el('button', 'btn btn-sm', 'View Details');
    info.append(details);
    card.append(info);
    bindCardMenu(card, open, posterMenu(hero, location));
    return card;
  }

  function posterTile(item, shape, location, folder = false) {
    const tile = el('button', `tile ${shape}`);
    const art = el('div', 'art');
    art.append(img(item.image));
    tile.append(art, el('span', 'name', item.name));
    const open = () => {
      markBusy(art);
      if (!folder) awaitingDetails = true;
      send({ cmd: folder ? 'folder' : 'open', ...location });
    };
    bindCardMenu(tile, open, folder ? null : posterMenu(item, location));
    return tile;
  }

  function resumeTile(item, index) {
    const tile = el('button', 'tile landscape');
    const art = el('div', 'art');
    art.append(img(item.image));
    if (item.left) art.append(el('span', 'time-left', item.left));
    const resume = el('div', 'resume');
    if (item.episode) resume.append(el('small', '', item.episode));
    resume.append(el('b', '', item.title));
    const bar = el('div', 'bar');
    const fill = el('i');
    fill.style.width = `${Math.round(Math.min(1, Math.max(0, item.progress)) * 100)}%`;
    bar.append(fill);
    resume.append(bar);
    art.append(resume);
    tile.append(art);
    if (item.subtitle) tile.append(el('span', 'name', item.subtitle));
    const resumePlayback = () => { markBusy(art); send({ cmd: 'resume', item: index }); };
    bindCardMenu(tile, resumePlayback, {
      title: item.title,
      description: [item.episode, item.subtitle].filter(Boolean).join(' · '),
      target: { kind: 'continue', item: index, key: item.key },
    });
    return tile;
  }

  function rowSection(title, tiles) {
    const section = el('section');
    section.append(el('h3', 'row-title', title));
    const scroll = el('div', 'row-scroll');
    scroll.append(...tiles);
    section.append(scroll);
    return section;
  }

  // Replaces a list of rows but keeps how far each row was scrolled sideways.
  function replaceRows(container, sections) {
    const offsets = [...container.querySelectorAll('.row-scroll')].map((r) => r.scrollLeft);
    container.replaceChildren(...sections);
    container.querySelectorAll('.row-scroll').forEach((r, i) => { r.scrollLeft = offsets[i] || 0; });
  }

  const homeHeroStrip = $('hero-strip');
  const homeBackdrop = $('home-backdrop');
  const homeHeroMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const HOME_HERO_INTERVAL_MS = 8000;
  let homeHeroes = [];
  let homeHeroContent = '';
  let homeHeroIndex = 0;
  let homeHeroInView = false;
  let homeHeroPointer = null;
  let homeHeroTimer;
  let homeHeroTarget = null;
  let homeHeroWrap = null;
  let homeBackdropRequest = null;

  function updateHomeBackdrop() {
    const source = homeHeroes[homeHeroIndex]?.image || null;
    if ((homeBackdropRequest?.getAttribute('src') ?? null) === source) return;
    homeBackdropRequest = source ? new Image() : null;
    if (!source) {
      homeBackdrop.replaceChildren();
      return;
    }
    const art = homeBackdropRequest;
    art.alt = '';
    art.onload = () => {
      if (art !== homeBackdropRequest) return;
      const previous = homeBackdrop.lastElementChild;
      homeBackdrop.append(art);
      if (!previous) return;
      const fade = art.animate([{ opacity: 0 }, { opacity: 1 }], {
        duration: homeHeroMotion.matches ? 0 : 650,
        easing: 'ease-in-out',
      });
      fade.onfinish = () => previous.remove();
    };
    art.onerror = () => {
      if (art === homeBackdropRequest) homeBackdrop.replaceChildren();
    };
    art.src = source;
  }

  function moveHomeHero(index, behavior = 'instant') {
    const card = homeHeroStrip.children[index];
    if (!card || $('home').hidden) return;
    const left = card.offsetLeft - homeHeroStrip.firstElementChild.offsetLeft;
    homeHeroStrip.scrollTo({ left, behavior });
    if (behavior === 'instant') {
      homeHeroIndex = index;
      updateHomeBackdrop();
    }
  }

  function canRotateHomeHero() {
    return homeHeroInView && !$('home').hidden && !document.hidden && homeHeroes.length > 1
      && homeHeroPointer === null && !homeHeroStrip.querySelector(':focus-visible') && !document.querySelector('dialog[open]');
  }

  function scheduleHomeHero() {
    clearTimeout(homeHeroTimer);
    if (canRotateHomeHero()) {
      homeHeroTimer = setTimeout(rotateHomeHero, HOME_HERO_INTERVAL_MS);
    } else {
      homeHeroWrap?.cancel();
      if (homeHeroTarget !== null) {
        homeHeroTarget = null;
        moveHomeHero(homeHeroIndex);
      }
    }
  }

  async function rotateHomeHero() {
    if (!canRotateHomeHero()) return;
    const next = (homeHeroIndex + 1) % homeHeroes.length;
    if (homeHeroMotion.matches) {
      moveHomeHero(next);
    } else if (next > 0) {
      homeHeroTarget = next;
      moveHomeHero(next, 'smooth');
    } else {
      // Fade around the wrap so the carousel does not scroll backwards through every card.
      const fade = homeHeroStrip.animate([{ opacity: 1 }, { opacity: 0.18 }], {
        duration: 220, easing: 'ease-in-out', fill: 'forwards',
      });
      homeHeroWrap = fade;
      try {
        await fade.finished;
      } catch {
        return;
      } finally {
        homeHeroWrap = null;
      }
      fade.cancel();
      if (!canRotateHomeHero()) return;
      moveHomeHero(0);
      homeHeroStrip.animate([{ opacity: 0.18 }, { opacity: 1 }], { duration: 460, easing: 'ease-out' });
    }
    scheduleHomeHero();
  }

  new IntersectionObserver(([entry]) => {
    homeHeroInView = entry.intersectionRatio >= 0.25;
    scheduleHomeHero();
  }, { threshold: 0.25 }).observe(homeHeroStrip);
  document.addEventListener('visibilitychange', scheduleHomeHero);
  document.querySelectorAll('dialog.sheet').forEach((sheet) => sheet.addEventListener('close', scheduleHomeHero));
  homeHeroStrip.addEventListener('focusin', scheduleHomeHero);
  homeHeroStrip.addEventListener('focusout', () => requestAnimationFrame(scheduleHomeHero));
  homeHeroStrip.addEventListener('pointerdown', (event) => {
    homeHeroPointer = event.pointerId;
    scheduleHomeHero();
  });
  for (const type of ['pointerup', 'pointercancel']) {
    window.addEventListener(type, (event) => {
      if (homeHeroPointer !== event.pointerId) return;
      homeHeroPointer = null;
      scheduleHomeHero();
    });
  }

  homeHeroStrip.addEventListener('scroll', () => {
    if ($('home').hidden || homeHeroes.length < 2) return;
    const [first, second] = homeHeroStrip.children;
    const step = second.offsetLeft - first.offsetLeft;
    if (step <= 0) return;
    homeHeroIndex = Math.min(homeHeroes.length - 1, Math.max(0, Math.round(homeHeroStrip.scrollLeft / step)));
    if (homeHeroTarget !== null) {
      const targetLeft = homeHeroStrip.children[homeHeroTarget].offsetLeft - first.offsetLeft;
      if (Math.abs(homeHeroStrip.scrollLeft - targetLeft) <= 1) homeHeroTarget = null;
    }
    updateHomeBackdrop();
    scheduleHomeHero();
  }, { passive: true });

  function showHomeHero(heroes) {
    const heroContent = JSON.stringify(heroes);
    if (heroContent !== homeHeroContent) {
      const previousKey = homeHeroes[homeHeroIndex]?.key;
      homeHeroWrap?.cancel();
      homeHeroTarget = null;
      homeHeroContent = heroContent;
      homeHeroes = heroes;
      homeHeroIndex = Math.max(0, heroes.findIndex((hero) => hero.key === previousKey));
      homeHeroStrip.replaceChildren(...heroes.map(heroCard));
      homeHeroStrip.hidden = !heroes.length;
      moveHomeHero(homeHeroIndex);
      updateHomeBackdrop();
      scheduleHomeHero();
    }
  }

  function showHome(msg) {
    const heroes = msg.heroEnabled === false ? [] : msg.hero;
    const sections = [];
    if (msg.continue.length) sections.push(rowSection('Continue Watching', msg.continue.map(resumeTile)));
    // Catalog rows open a title; collection rows (Discover, Streaming…) open a folder.
    msg.rows.forEach((row) => sections.push(rowSection(row.title,
      row.items.map((item, i) => posterTile(item, row.shape,
        { from: 'row', row: row.key, item: i }, row.kind === 'collection')))));
    replaceRows($('home-rows'), sections);
    const empty = !heroes.length && !sections.length;
    $('home-skeleton').hidden = !(empty && msg.loading);
    $('home-empty').hidden = !(empty && !msg.loading);
    $('home-hero-skeleton').hidden = msg.heroEnabled === false;

    try {
      showHomeHero(heroes);
    } catch (error) {
      console.error('Failed to render the Home hero', error);
      clearTimeout(homeHeroTimer);
      homeHeroWrap?.cancel();
      homeHeroTarget = null;
      homeHeroContent = '';
      homeHeroes = [];
      homeHeroIndex = 0;
      homeHeroStrip.hidden = true;
      homeHeroStrip.replaceChildren();
      updateHomeBackdrop();
      $('home-hero-skeleton').hidden = true;
      $('home-skeleton').hidden = sections.length > 0 || !msg.loading;
      $('home-empty').hidden = sections.length > 0 || msg.loading;
    }
  }

  document.querySelectorAll('[data-back]').forEach((button) => button.addEventListener('click', () => {
    if (!$('player').hidden) {
      player('back');
      return;
    }
    stopDpadPress();
    const phonePage = $('remote').hidden && (pcRoute === 'details' || pcRoute === 'streams');
    send({ cmd: phonePage ? 'back' : 'dpadBack' });
  }));

  // ─── Details: the title's page, like the PC; its buttons run the PC's ───
  let details = null;
  let detailsKey = null;
  let season = null;
  let detailsEpisodePositioned = false;

  function titleArt(container, logo, name) {
    container.replaceChildren();
    if (logo) {
      const image = img(logo, 'logo');
      image.onerror = () => image.replaceWith(el('div', 't-title2', name));
      container.append(image);
    } else {
      container.append(el('div', 't-title2', name));
    }
  }

  function showDetails(msg) {
    details = msg;
    // A title just opened shows the skeleton until it has loaded; refreshes of the same title don't.
    if (msg.name && !msg.loading) awaitingDetails = false;
    $('details').classList.toggle('is-loading', !msg.name || awaitingDetails);
    if (!msg.name) return;
    if (msg.key !== detailsKey) {
      detailsKey = msg.key;
      season = null;
      detailsEpisodePositioned = false;
      $('d-bg').src = msg.background || '';
      titleArt($('d-title'), msg.logo, msg.name);
      $('d-desc').classList.remove('open');
    }
    const meta = $('d-meta');
    meta.replaceChildren();
    if (msg.year) meta.append(el('b', '', msg.year));
    const seasonCount = msg.seasons.filter((s) => s.label !== 'Specials').length;
    if (seasonCount) meta.append(el('span', '', seasonCount === 1 ? '1 Season' : `${seasonCount} Seasons`));
    if (msg.runtime) meta.append(el('span', '', msg.runtime));
    if (msg.ageRating) meta.append(el('span', 'tag', msg.ageRating));
    const ratings = $('d-ratings');
    ratings.replaceChildren();
    const SOURCES = { imdb: 'IMDb', tmdb: 'TMDB', tomatoes: 'RT', trakt: 'Trakt', metacritic: 'MC', letterboxd: 'Letterboxd', mal: 'MAL' };
    const rated = msg.ratings.some((r) => r.source.toLowerCase() === 'imdb') || !(Number(msg.imdb) > 0)
      ? msg.ratings : [{ source: 'imdb', value: msg.imdb }, ...msg.ratings];
    rated.forEach((r) => {
      const s = el('span', 'score', `${SOURCES[r.source.toLowerCase()] || r.source} `);
      s.append(el('b', '', String(r.value)));
      ratings.append(s);
    });
    $('d-genres').textContent = msg.genres;
    $('d-desc').textContent = msg.description || '';
    $('d-desc').hidden = !msg.description;
    $('d-play-label').textContent = msg.playLabel || 'Play';
    $('d-watched').setAttribute('aria-pressed', msg.watched);
    $('d-saved').setAttribute('aria-pressed', msg.saved);
    renderEpisodes();
  }

  function positionDetailsEpisode() {
    if (detailsEpisodePositioned || season !== null || awaitingDetails || $('details').hidden) return;
    const episode = $('d-episodes').querySelector('[data-preferred-episode]');
    if (!episode) return;
    requestAnimationFrame(() => {
      if (detailsEpisodePositioned || !episode.isConnected || season !== null || awaitingDetails || $('details').hidden) return;
      detailsEpisodePositioned = true;
      episode.scrollIntoView({ block: 'start' });
    });
  }

  function renderEpisodes() {
    const seasons = details.seasons;
    $('d-episodes-section').hidden = !seasons.length;
    if (!seasons.length) return;
    const filler = $('d-filler');
    filler.hidden = typeof details.fillerDetection !== 'boolean';
    filler.replaceChildren();
    if (!filler.hidden) {
      filler.append(
        toggle('Anime Filler Detection', '', details.fillerDetection, (value) => send({ cmd: 'fillerDetection', value })),
        toggle('Hide Anime Filler Episodes', '', details.hideFillers, (value) => send({ cmd: 'hideFillers', value })),
      );
    }
    const selected = seasons.find((s) => s.number === season) ||
      seasons.find((s) => s.number === details.preferredSeason) || seasons[0];
    $('d-seasons').replaceChildren(...seasons.map((s) => {
      const chip = el('button', 'chip', s.label);
      chip.setAttribute('aria-pressed', s === selected);
      chip.addEventListener('click', () => { season = s.number; renderEpisodes(); });
      return chip;
    }));
    const episodes = selected.episodes;
    $('d-episodes').replaceChildren(...episodes.map((ep) =>
      episodeCard(ep, () => send({ cmd: 'episode', item: ep.index }), false,
        { kind: 'episode', key: details.key, item: ep.index, id: ep.id })));
    if (!episodes.length) $('d-episodes').append(el('p', 't-sub text-sub', 'All episodes in this season are hidden.'));
    positionDetailsEpisode();
  }

  function episodeCard(ep, onClick, blur = false, menuTarget = null) {
    const card = el('button', 'episode');
    if (ep.current || ep.preferred) card.setAttribute('aria-current', 'true');
    if (ep.preferred) card.dataset.preferredEpisode = '';
    const thumb = el('div', 'thumb');
    thumb.append(img(ep.image, blur ? 'blurred' : ''));
    if (ep.code) thumb.append(el('span', 'code', ep.code));
    const copy = el('span', 'copy');
    copy.append(el('b', '', ep.title || ep.code));
    if (ep.overview) copy.append(el('p', '', ep.overview));
    const info = [ep.current ? 'Playing' : ep.watched ? 'Watched' : null, ep.fillerLabel, ep.runtime,
      ep.rating ? `IMDb ${ep.rating}` : null, ep.released].filter(Boolean).join(' · ');
    if (info) copy.append(el('small', '', info));
    card.append(thumb, copy);
    bindCardMenu(card, () => { markBusy(thumb); onClick(); }, menuTarget && {
      title: ep.title || ep.code, description: ep.overview, target: menuTarget,
    });
    return card;
  }
  $('d-desc').addEventListener('click', () => $('d-desc').classList.toggle('open'));
  $('d-play').addEventListener('click', () => { markBusy($('d-play')); send({ cmd: 'play' }); });
  $('d-watched').addEventListener('click', () => send({ cmd: 'watched' }));
  $('d-saved').addEventListener('click', () => send({ cmd: 'saved' }));

  // ─── Sources: the list the PC shows; a tap plays that source ───
  let streams = { groups: [] };
  let streamsTitle = null;
  let addonFilter = null;
  function showStreams(msg) {
    streams = msg;
    if (msg.title && msg.title + msg.episode !== streamsTitle) {
      streamsTitle = msg.title + msg.episode;
      addonFilter = null;
      $('s-bg').src = msg.background || '';
      titleArt($('s-title'), msg.logo, msg.title);
    }
    $('s-episode').textContent = msg.episode || '';
    // Resume from the saved position, or start over, like the PC's banner.
    $('s-resume').hidden = !msg.resumeMs;
    if (msg.resumeMs) {
      $('s-resume-label').textContent = `Resume from ${clock(msg.resumeMs)}`;
      $('s-resume-btn').setAttribute('aria-pressed', !msg.fromStart);
      $('s-start-btn').setAttribute('aria-pressed', !!msg.fromStart);
    }
    renderStreams();
  }
  $('s-resume-btn').addEventListener('click', () => send({ cmd: 'fromStart', value: false }));
  $('s-start-btn').addEventListener('click', () => send({ cmd: 'fromStart', value: true }));
  function renderStreams() {
    const scroll = $('streams').hidden ? null : scrollY;
    const groups = streams.groups.map((g, i) => ({ ...g, i })).filter((g) => g.streams.length || g.loading || g.error);
    const chips = [{ addon: 'All', i: null }, ...groups].map((g) => {
      const chip = el('button', 'chip', g.addon);
      chip.setAttribute('aria-pressed', addonFilter === g.i);
      chip.addEventListener('click', () => { addonFilter = g.i; renderStreams(); });
      return chip;
    });
    $('s-addons').replaceChildren(...chips);
    const shown = groups.filter((g) => addonFilter === null || g.i === addonFilter);
    const nodes = [];
    shown.forEach((group) => {
      // An addon still searching shows a spinner by its name.
      const header = el('div', 'addon addon-loading', group.addon);
      if (group.loading) header.append(el('span', 'spin-ring sm'));
      if (!group.streams.length) {
        if (group.loading) nodes.push(header);
        // An addon that failed says why, instead of looking empty.
        else if (group.error) nodes.push(header, el('div', 'card t-sub text-sub', group.error));
        return;
      }
      nodes.push(header);
      group.streams.forEach((stream, s) => {
        const card = el('button', 'stream-card');
        card.append(el('b', '', stream.name));
        if (stream.details) card.append(el('span', 'sub', stream.details));
        if (stream.badges.length) {
          const badges = el('span', 'badges');
          stream.badges.forEach((b) => badges.append(el('span', 'badge badge-outline badge-sq', b)));
          card.append(badges);
        }
        bindCardMenu(card, () => { markBusy(card); send({ cmd: 'stream', group: group.i, item: s }); }, {
          title: stream.name, description: stream.details,
          target: { kind: 'source', key: streams.key, group: group.i, item: s, id: stream.menuId },
        });
        nodes.push(card);
      });
    });
    const anyStreams = shown.some((g) => g.streams.length);
    if (!anyStreams && streams.loading) nodes.unshift(loader('Finding sources…'));
    $('s-list').replaceChildren(...nodes);
    $('s-empty').hidden = anyStreams || streams.loading || shown.some((g) => g.error);
    $('s-empty').textContent = 'No sources found.';
    if (scroll !== null) scrollTo({ top: scroll });
  }
  $('s-reload').addEventListener('click', () => send({ cmd: 'reloadStreams' }));

  // ─── Search: type here, the PC searches; results open the title there ───
  let searchTimer = null;
  let searchResults = { loading: false, rows: [] };
  $('search-input').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => send({ cmd: 'search', query: $('search-input').value }), 400);
    renderSearch();
  });
  $('search-input').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    clearTimeout(searchTimer);
    send({ cmd: 'search', query: $('search-input').value });
    $('search-input').blur();
  });
  function showSearch(msg) {
    searchResults = msg;
    renderSearch();
  }
  function renderSearch() {
    const typed = $('search-input').value.trim();
    const rows = typed ? searchResults.rows : [];
    replaceRows($('search-rows'), rows.map((row) => rowSection(row.title,
      row.items.map((item, i) => posterTile(item, row.shape, { from: 'search', row: row.key, item: i })))));
    const searching = typed && searchResults.loading;
    if (searching) $('search-rows').append(loader(rows.length ? 'Loading more results…' : 'Searching…'));
    $('search-empty').hidden = rows.length > 0 || searching;
    $('search-empty').textContent = !typed ? 'Type to search. Results open on your PC.' : 'No results.';
  }

  // A spinner with what it is waiting for.
  function loader(text) {
    const box = el('div', 'loading');
    box.append(el('span', 'spin-ring'), el('span', '', text));
    return box;
  }
  renderSearch();
  updateView();

  // The hero: artwork with the title's logo over it (the title as text when there is no logo), then the episode.
  function showMedia(msg) {
    const art = $('art');
    if (art.dataset.src !== msg.artwork) {
      art.dataset.src = msg.artwork;
      art.classList.remove('on');
      $('backdrop').classList.remove('on');
      if (msg.artwork) {
        art.onload = () => { art.classList.add('on'); $('backdrop').classList.add('on'); };
        art.src = msg.artwork;
        $('backdrop').style.setProperty('--art', `url("${encodeURI(msg.artwork)}")`);
      } else {
        art.removeAttribute('src');
      }
    }
    const logo = $('logo');
    if (logo.dataset.src !== msg.logo) {
      logo.dataset.src = msg.logo;
      logo.hidden = !msg.logo;
      logo.onerror = () => { logo.hidden = true; $('hero-title').hidden = false; };
      if (msg.logo) logo.src = msg.logo;
    }
    $('hero-title').textContent = msg.title;
    $('hero-title').hidden = Boolean(msg.logo);
    $('ep-info').textContent = msg.episodeInfo;
    $('ep-info').hidden = !msg.episodeInfo;
    $('ep-title').textContent = msg.episodeTitle;
    $('ep-title').hidden = !$('ep-title').textContent;
    $('synopsis').textContent = msg.description;
    $('synopsis').hidden = !msg.description;
  }
  $('synopsis').addEventListener('click', () => $('synopsis').classList.toggle('open'));
  $('seek-back').addEventListener('click', () => player('keyboardSeek10Back'));
  $('seek-forward').addEventListener('click', () => player('keyboardSeek10Forward'));
  $('next-episode').addEventListener('click', () => player('playNextEpisode'));
  $('skip-segment').addEventListener('click', () => {
    if (state.active && state.skipSegment) player('skipInterval', state.skipSegment.targetMs);
  });

  // Sets a slider and paints its filled part.
  function setRange(range, value) {
    range.value = value;
    range.style.setProperty('--p', ((range.value - range.min) / (range.max - range.min || 1)) * 100 + '%');
  }

  const clock = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    const two = (n) => String(n).padStart(2, '0');
    return s >= 3600 ? `${Math.floor(s / 3600)}:${two(Math.floor(s / 60) % 60)}:${two(s % 60)}` : `${Math.floor(s / 60)}:${two(s % 60)}`;
  };
  function showTime(position, duration) {
    if (draggingSeek) return;
    $('seek').max = Math.max(1, duration);
    setRange($('seek'), position);
    $('position').textContent = clock(position);
    $('duration').textContent = clock(duration);
  }
  $('seek').addEventListener('input', () => {
    draggingSeek = true;
    setRange($('seek'), $('seek').value);
    $('position').textContent = clock(Number($('seek').value));
  });
  $('seek').addEventListener('change', () => { draggingSeek = false; player('scrubFinish', Number($('seek').value)); });
  $('volume').addEventListener('input', () => {
    draggingVolume = true;
    setRange($('volume'), $('volume').value);
    $('volume-label').textContent = Math.round(Number($('volume').value) * 100) + '%';
    player('volumeChangeTemporary', Number($('volume').value));
  });
  $('volume').addEventListener('change', () => { draggingVolume = false; player('volumeChange', Number($('volume').value)); });
  $('play').addEventListener('click', () => player('toggle'));

  // Buttons click the same control on the PC, so the PC opens its panel, and the same panel opens here.
  document.querySelectorAll('[data-click]').forEach((btn) => btn.addEventListener('click', () => {
    click(btn.dataset.click);
    if (btn.dataset.panel) {
      $('more').close();
      openSheet(btn.dataset.panel);
    } else if (!('stay' in btn.dataset)) {
      $('more').close();
    }
  }));
  $('more-open').addEventListener('click', () => present($('more')));

  // ─── The player's panels ───
  let openPanel = null;
  let playerSeason = null;
  let positionPlayingEpisode = false;
  let subtitleLanguage = '__off__';
  let subtitleTab = 'subtitles';
  let lastSvpMode = 'auto';

  function openSheet(name) {
    openPanel = name;
    if (name === 'episodes') {
      playerSeason = null;
      positionPlayingEpisode = true;
    }
    if (name === 'subtitles') { subtitleLanguage = state.subtitles.language; subtitleTab = 'subtitles'; }
    renderPanel();
    $('panel-body').scrollTop = 0;
    if (!$('panel').open) present($('panel'));
  }
  // Closing here closes the PC's panel too.
  $('panel').addEventListener('close', () => {
    if ($('panel').open) return;
    const closedPanel = openPanel;
    openPanel = null;
    if (closedPanel === 'p2pConsent') player('cancelP2pForPlayerControls');
    else if (closedPanel) send({ cmd: 'close' });
  });
  const closeSheet = () => $('panel').close();
  function closeSheetFromPlayer() {
    openPanel = null;
    closeSheet();
  }

  function renderPanel() {
    const body = $('panel-body');
    const scroll = body.scrollTop;
    const chipScroll = body.querySelector('.subtitle-languages, .episode-seasons')?.scrollLeft ?? 0;
    body.replaceChildren();
    $('panel-actions').replaceChildren();
    $('panel-subtitle').hidden = true;
    $('panel-close').textContent = openPanel === 'p2pConsent' ? state.p2pConsent.cancelLabel : 'Close';
    panels[openPanel]();
    body.scrollTop = scroll;
    const chips = body.querySelector('.subtitle-languages, .episode-seasons');
    if (chips) chips.scrollLeft = chipScroll;
    if (openPanel === 'episodes' && !state.episodes.streams && positionPlayingEpisode) {
      const episode = body.querySelector('.episode[aria-current="true"]');
      if (episode) requestAnimationFrame(() => {
        if (openPanel !== 'episodes' || !positionPlayingEpisode || !episode.isConnected) return;
        positionPlayingEpisode = false;
        body.scrollTop += episode.getBoundingClientRect().top - body.getBoundingClientRect().top;
        const activeSeason = chips?.querySelector('[aria-pressed="true"]');
        if (activeSeason) chips.scrollLeft += activeSeason.getBoundingClientRect().left - chips.getBoundingClientRect().left;
      });
    }
  }

  // ─── Building blocks, from cuppa.css ───
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  const add = (...nodes) => $('panel-body').append(...nodes);
  function header(title, subtitle) {
    $('panel-title').textContent = title;
    $('panel-subtitle').textContent = subtitle || '';
    $('panel-subtitle').hidden = !subtitle;
  }
  function action(label, onClick) {
    const btn = el('button', 'btn btn-sm btn-gray', label);
    btn.addEventListener('click', onClick);
    $('panel-actions').append(btn);
  }
  function tick() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'line tick');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.innerHTML = '<path d="M20 6 9 17l-5-5"/>';
    return svg;
  }
  const group = (...rows) => { const list = el('div', 'group-list'); list.append(...rows); return list; };
  const section = (title) => el('div', 'section-title', title);
  const empty = (text) => add(el('div', 'card t-sub text-sub', text));

  // A choice in a list: name, optional detail and tag, a tick when chosen.
  function choice({ label, detail, tag, checked, disabled, onClick, trailing }) {
    const btn = el('button', 'row');
    btn.setAttribute('aria-checked', Boolean(checked));
    btn.disabled = Boolean(disabled);
    const copy = el('span', 'copy');
    if (tag) copy.append(el('span', 'badge badge-tint badge-sq', tag));
    copy.append(el('span', '', label));
    if (detail) copy.append(el('small', '', detail));
    btn.append(copy);
    if (trailing) btn.append(trailing);
    btn.append(tick());
    btn.addEventListener('click', onClick);
    return btn;
  }
  // A setting with a value and a - / + stepper, like the player's steppers.
  function stepper(label, value, onMinus, onPlus, disabled = false) {
    const row = el('div', 'row');
    row.append(el('span', 'copy', label), el('span', 'value', value));
    const seg = el('div', 'seg');
    [['-', onMinus, 'Less'], ['+', onPlus, 'More']].forEach(([text, onClick, name]) => {
      const btn = el('button', '', text);
      btn.setAttribute('aria-label', `${name} ${label}`);
      btn.disabled = disabled;
      btn.addEventListener('click', onClick);
      seg.append(btn);
    });
    row.append(seg);
    return row;
  }
  // An on/off setting.
  function toggle(label, detail, on, onChange, disabled = false) {
    const row = el('label', 'row');
    const copy = el('span', 'copy', label);
    if (detail) copy.append(el('small', '', detail));
    const sw = el('span', 'switch');
    const input = el('input');
    input.type = 'checkbox';
    input.checked = on;
    input.disabled = disabled;
    input.addEventListener('change', () => onChange(input.checked));
    sw.append(input);
    row.append(copy, sw);
    return row;
  }

  const languageName = (code, fallback = '') => {
    const value = String(code || '').trim().toLowerCase().replace(/_/g, '-');
    if (!value || value === 'und' || value === '__unknown__') return fallback || 'Unknown';
    try { return new Intl.DisplayNames([navigator.language || 'en'], { type: 'language' }).of(value) || value; }
    catch (_) { return fallback || value.toUpperCase(); }
  };

  const speeds = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  const upscalerOptions = [
    { key: 'off', label: 'Off', value: 0 }, { key: 'auto', label: 'Anime Only', value: 1 },
    { key: 'always_on', label: 'All Media', value: 2 },
  ];
  const svpOptions = [
    { mode: 'auto', label: 'Anime Only', description: '60 FPS for Anime and Cartoons only', value: 1 },
    { mode: 'global', label: 'All Media', description: '60 FPS for all contents', value: 2 },
  ];
  const contentLabels = { anime: 'Anime', cartoon: 'Cartoon', live_action: 'Live Action' };

  function renderSourceCards(sources, selectAction) {
    if (!sources.items.length) return sources.loading ? add(loader('Loading sources…')) : empty('No streams found');
    sources.items.forEach((item) => {
      const card = el('button', 'card card-tap stream');
      card.setAttribute('aria-checked', item.current);
      card.disabled = !item.enabled;
      const top = el('span', 'top', item.label);
      if (item.current) top.append(el('span', 'badge badge-solid', 'Playing'));
      card.append(top);
      if (item.subtitle) card.append(el('span', 'sub', item.subtitle));
      if (item.badges.length || item.size) {
        const badges = el('span', 'badges');
        item.badges.forEach((src) => { const img = el('img'); img.src = src; img.alt = ''; badges.append(img); });
        if (item.size) badges.append(el('span', 'badge badge-outline badge-sq', item.size));
        card.append(badges);
      }
      bindCardMenu(card, () => player(selectAction, item.index));
      add(card);
    });
  }

  const panels = {
    p2pConsent() {
      const consent = state.p2pConsent;

      add(el('p', 't-sub text-sub', consent.body));

    },

    sources() {
      header('Sources', state.title);
      action('Reload', () => player('reloadSources'));
      renderSourceCards(state.sources, 'selectSource');
    },

    episodes() {
      const { seasons, items, streams, blurUnwatched } = state.episodes;
      if (streams) {
        header('Episode sources', streams.title);
        action('Reload', () => player('reloadEpisodeStreams'));
        renderSourceCards(streams, 'selectEpisodeStream');
        return;
      }

      header('Episodes', state.title);
      if (!seasons.some((season) => season.number === playerSeason)) {
        playerSeason = (seasons.find((season) => season.current) || seasons[0])?.number ?? null;
      }
      if (seasons.length > 1) {
        const chips = el('div', 'chips episode-seasons');
        seasons.forEach((season) => {
          const chip = el('button', 'chip', season.label);
          chip.setAttribute('aria-pressed', season.number === playerSeason);
          chip.addEventListener('click', () => {
            playerSeason = season.number;
            positionPlayingEpisode = false;
            $('panel-body').scrollTop = 0;
            renderPanel();
          });
          chips.append(chip);
        });
        add(chips);
      }
      const episodes = items.filter((episode) => episode.season === playerSeason);
      if (!episodes.length) return empty('No episodes available');
      episodes.forEach((episode) => {
        const blur = blurUnwatched && !episode.watched && !episode.current;
        add(episodeCard(episode, () => player('selectEpisode', episode.index), blur));
      });
    },

    subtitles() {
      const subs = state.subtitles;
      header('Subtitles');

      const secondary = Boolean(subs.slots?.secondarySelected);
      const sendSubtitle = (type, value) => player(secondary ? `secondary:${type}` : type, value);
      if (subs.slots) {
        const slots = el('div', 'seg seg-fill');
        slots.setAttribute('role', 'group');
        slots.setAttribute('aria-label', 'Subtitle slot');
        [subs.slots.primaryLabel, subs.slots.secondaryLabel].forEach((label, index) => {
          const btn = el('button', '', label);
          btn.setAttribute('aria-pressed', Number(secondary) === index);
          btn.addEventListener('click', () => player('subtitleSlot', index));
          slots.append(btn);
        });
        add(slots);
      }

      // The panel's tabs; switching here switches the PC's tab too.
      const tabs = el('div', 'seg seg-fill');
      [['subtitles', 'Subtitles', 'subtitleTabSubtitles'], ['customization', 'Customization', 'subtitleTabCustomization']]
        .forEach(([tab, label, target]) => {
          const btn = el('button', '', label);
          btn.setAttribute('aria-pressed', subtitleTab === tab);

      const languages = subs.languages.some((l) => l.key === '__off__')
        ? subs.languages : [{ key: '__off__', label: 'None', count: 0 }, ...subs.languages];
      const chips = el('div', 'chips subtitle-languages');
      languages.forEach((language) => {
        const label = language.key === '__off__' ? (language.label || 'None') : (language.label || 'Imported');
        const chip = el('button', 'chip', label);
        chip.setAttribute('aria-pressed', language.key === subtitleLanguage);

        chip.addEventListener('click', () => {
