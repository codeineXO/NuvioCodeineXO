          renderPanel();
        });
        chips.append(chip);
      });
      add(chips);

      const options = subs.options.filter((o) => o.language === subtitleLanguage);
      if (subtitleLanguage === '__off__') return add(el('div', 'card t-sub text-sub', 'Subtitles are off.'));
      add(group(...options.map((option) => choice({
        tag: option.source, label: option.title || option.source, detail: option.metadata,
        checked: option.id === subs.selected || option.selected,
        onClick: () => sendSubtitle(option.kind === 'addon' ? 'selectAddonSubtitle' : 'selectBuiltInSubtitleTrack', option.index),
      }))));
    },

    audio() {
      const audio = state.audio;
      header('Audio Tracks');
      if (!audio.tracks.length) empty('No audio tracks available');
      else add(group(...audio.tracks.map((track) => choice({
        label: track.label || languageName(track.language) || `Track ${track.index + 1}`,
        detail: track.language && track.language !== 'und' ? languageName(track.language) : '',
        checked: track.selected,
        onClick: () => { player('selectAudioTrack', track.id >= 0 ? track.id : track.index); closeSheet(); },
      }))));
      add(group(toggle('Night Mode (DRC)', 'Normalize loudness to boost quiet voices', audio.nightMode,
        (on) => player('toggleAudioNightMode', on ? 1 : 0))));
    },

    enhance() {
      const e = state.enhancements;
      header('Enhancements');

      const index = Math.max(0, upscalerOptions.findIndex((o) => o.key === e.upscaler));
      const upscalerOff = upscalerOptions[index].key === 'off';
      const step = (delta) => player('setAnimeUpscalerOption',
        upscalerOptions[(index + delta + upscalerOptions.length) % upscalerOptions.length].value);
      add(section('Anime Upscaler'), group(
        stepper('Mode', upscalerOptions[index].label, () => step(-1), () => step(1)),
        ...e.modes.map((mode) => choice({
          label: mode.label, detail: mode.description, checked: !upscalerOff && mode.index === e.mode,
          disabled: upscalerOff, onClick: () => player('setAnimeUpscalerMode', mode.index),
        })),
      ));

      const svpOff = e.svp === 'off' || !e.svpAvailable;
      if (!svpOff) lastSvpMode = e.svp === 'global' || e.svp === 'cinema' ? 'global' : 'auto';
      add(section('Motion Smoothing (SVP)'));
      if (!e.svpAvailable) add(el('div', 'note', 'Motion smoothing runtime is unavailable. Check its status in Settings.'));
      add(group(
        toggle('Motion smoothing', '', !svpOff, (on) => player('setSvpMode', on ? (lastSvpMode === 'global' ? 2 : 1) : 0), !e.svpAvailable),
        ...svpOptions.map((option) => choice({
          label: option.label, detail: option.description, checked: !svpOff && option.mode === lastSvpMode,
          disabled: svpOff, onClick: () => { lastSvpMode = option.mode; player('setSvpMode', option.value); },
        })),
      ));
      const detected = el('div', 'row');
      detected.append(el('span', 'copy', 'Detected Content'), el('span', 'badge badge-tint', contentLabels[e.content] || 'Unknown'));
      add(group(detected));
    },

    speed() {
      header('Playback Speed');
      const current = parseFloat(state.speed);
      add(group(...speeds.map((speed) => choice({
        label: speed === 1 ? '1x (Normal)' : `${speed}x`, checked: Math.abs(speed - current) < 0.01,
        onClick: () => { player('setPlaybackSpeed', speed); closeSheet(); },
      }))));
    },

    eyeFilter() {
      header('Eye Filter');
      add(group(
        toggle('Eye filter', '', state.eyeFilter, (on) => player('setEyeFilterEnabled', on ? 1 : 0)),
        toggle('Frosted matte filter', 'Film grain & frosted effect', state.frostedFilter, (on) => player('setGrainFilterEnabled', on ? 1 : 0))
      ));
    },

    chapters() {
      header('Chapters');
      add(group(...state.chapters.map((chapter, i) => choice({
        label: chapter.title || `Chapter ${i + 1}`, detail: clock(chapter.startMs),
        onClick: () => { player('selectChapter', i); closeSheet(); },
      }))));
    },
  };

  // ─── Subtitles → Customization, control for control ───
  const alphaPercent = (argb) => Math.round(parseInt(String(argb).slice(1, 3), 16) / 255 * 100);
  const rgbHex = (argb) => '#' + String(argb).slice(3, 9);
  const cssColor = (argb) => rgbHex(argb) + String(argb).slice(1, 3); // #AARRGGBB from the player → CSS #RRGGBBAA
  const formatDelay = (ms) => `${ms >= 0 ? '+' : '-'}${(Math.abs(ms) / 1000).toFixed(3)}s`;

  // The player's swatches, plus "Custom": the phone's own colour picker.
  function swatches(label, colors, selected, onSwatch, onColor, disabled) {
    const row = el('div', 'row row-stack');
    row.append(el('span', 'copy', label));
    const box = el('div', 'swatches');
    colors.forEach((color, index) => {
      const swatch = el('button', 'swatch');
      swatch.setAttribute('aria-label', `${label} ${index + 1}`);
      swatch.setAttribute('aria-pressed', rgbHex(color).toLowerCase() === rgbHex(selected).toLowerCase());
      swatch.style.setProperty('--swatch', cssColor(color));
      swatch.disabled = disabled;
      swatch.addEventListener('click', () => onSwatch(index));
      box.append(swatch);
    });
    const custom = el('label', 'btn btn-sm btn-gray custom', 'Custom');
    const input = el('input');
    input.type = 'color';
    input.value = rgbHex(selected);
    input.disabled = disabled;
    input.addEventListener('change', () => onColor(parseInt(input.value.slice(1), 16)));
    custom.append(input);
    box.append(custom);
    row.append(box);
    return row;
  }

  function customization(style, sendSubtitle) {
    const off = !style.custom;
    const noEffect = style.effect === 'none';
    const boxed = style.effect === 'background_box';
    const text = alphaPercent(style.textColor);
    const outline = alphaPercent(style.effectColor);
    const delay = stepper('Subtitle Delay', formatDelay(style.delayMs),
      () => sendSubtitle('subtitleDelayDelta', -100), () => sendSubtitle('subtitleDelayDelta', 100));
    delay.classList.add('row-delay');
    const reset = el('button', 'btn btn-sm btn-gray', 'Reset');
    reset.addEventListener('click', () => sendSubtitle('subtitleDelayReset'));
    delay.querySelector('.value').after(reset);
    add(group(
      delay,
      stepper('Font Size', `${style.fontSize}sp`, () => sendSubtitle('subtitleFontSizeDelta', -1), () => sendSubtitle('subtitleFontSizeDelta', 1)),
      stepper('Bottom Offset', String(style.bottomOffset), () => sendSubtitle('subtitleBottomOffsetDelta', -5), () => sendSubtitle('subtitleBottomOffsetDelta', 5)),
    ));

    add(group(
      toggle('Use custom styling', '', style.custom, () => player('subtitleCustomStyleToggle')),
      stepper('Font', style.font, () => sendSubtitle('subtitleFontDelta', -1), () => sendSubtitle('subtitleFontDelta', 1), off),
      toggle('Bold', '', style.bold, () => sendSubtitle('subtitleBoldToggle'), off),
      swatches('Color', style.textSwatches, style.textColor,
        (index) => sendSubtitle('subtitleTextColor', index), (rgb) => sendSubtitle('subtitleTextColorRgb', rgb), off),
      stepper('Text Opacity', `${text}%`, () => sendSubtitle('subtitleTextOpacity', Math.max(0, text - 10)),
        () => sendSubtitle('subtitleTextOpacity', Math.min(100, text + 10)), off),
      stepper('Outline Style', style.effectLabel, () => sendSubtitle('subtitleOutlineEffectDelta', -1), () => sendSubtitle('subtitleOutlineEffectDelta', 1), off),
      swatches(boxed ? 'Box Color' : 'Outline Color', style.outlineSwatches, style.effectColor,
        (index) => sendSubtitle('subtitleOutlineColor', index), (rgb) => sendSubtitle('subtitleOutlineColorRgb', rgb), off || noEffect),
      stepper(boxed ? 'Box Opacity' : 'Outline Opacity', `${outline}%`, () => sendSubtitle('subtitleOutlineOpacity', Math.max(0, outline - 10)),
        () => sendSubtitle('subtitleOutlineOpacity', Math.min(100, outline + 10)), off || noEffect),
      stepper('Outline Thickness', String(style.outlineWidth), () => sendSubtitle('subtitleOutlineThicknessDelta', -1),
        () => sendSubtitle('subtitleOutlineThicknessDelta', 1), off || boxed || noEffect),
    ));

    // Auto Sync: tap the line being spoken now, and the subtitle shifts to match.
    const sync = style.autoSync;
    const buttons = el('div', 'row');
    buttons.append(el('span', 'copy', 'Auto Sync'));
    [['Reload', 'subtitleAutoSyncReload'], ['Capture', 'subtitleAutoSyncCapture']].forEach(([label, type]) => {
      const btn = el('button', 'btn btn-sm btn-gray', label);
      btn.disabled = !sync.enabled;
      btn.addEventListener('click', () => sendSubtitle(type));
      buttons.append(btn);
    });
    const status = !sync.enabled ? 'Select an addon subtitle first' : sync.loading ? 'Loading subtitle lines...' : sync.error;
    const rows = [buttons];
    if (status) { const note = el('div', 'row note', status); rows.push(note); }
    sync.cues.forEach((cue) => rows.push(choice({ label: cue.text, detail: cue.time, onClick: () => sendSubtitle('subtitleAutoSyncCue', cue.index) })));
    add(group(...rows));

    const resetAll = el('button', 'btn btn-block btn-gray', 'Reset Defaults');
    resetAll.addEventListener('click', () => sendSubtitle('subtitleStyleReset'));
    add(resetAll);
  }

  function stopDpadPress() {
    if (!dpadPress) return;
    clearTimeout(dpadPress.timer);
    clearInterval(dpadPress.timer);
    dpadPress.button.classList.remove('pressed');
    dpadPress = null;
  }

  document.querySelectorAll('.dpad button').forEach((button) => {
    const key = button.dataset.key;
    const msg = key ? { cmd: 'key', key } : { cmd: 'ok' };
    const ownsPress = (e) => dpadPress?.button === button && dpadPress.pointerId === e.pointerId;
    button.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || dpadPress) return;
      e.preventDefault();
      button.classList.add('pressed');
      const press = { button, pointerId: e.pointerId, longPressed: false, timer: null };
      dpadPress = press;
      if (key) {
        send(msg);
        press.timer = setTimeout(() => { press.timer = setInterval(() => send(msg), 120); }, 400);
      } else {
        press.timer = setTimeout(() => {
          press.longPressed = true;
          send({ cmd: 'okLong' });
        }, 500);
      }
    });
    button.addEventListener('pointerup', (e) => {
      if (!ownsPress(e)) return;
      const shortOk = !key && !dpadPress.longPressed;
      stopDpadPress();
      if (shortOk) send(msg);
    });
    ['pointerleave', 'pointercancel'].forEach((event) => {
      button.addEventListener(event, (e) => { if (ownsPress(e)) stopDpadPress(); });
    });
    button.addEventListener('click', (e) => { if (e.detail === 0) send(msg); });
    button.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopDpadPress();
  });

  connect();
</script>
</body>
</html>
