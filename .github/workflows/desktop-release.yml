name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts, validate a release, create a draft, or publish
        required: true
        type: choice
        options:
          - build-only
          - dry-run
          - draft
          - publish
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: ${{ inputs.mode }} Windows desktop release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.version }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      current_bump: ${{ steps.release.outputs.current_bump }}
      previous_bump: ${{ steps.release.outputs.previous_bump }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        env:
          VERSION_FILE: composeApp/Configuration/DesktopVersion.properties
          VERSION_KEY: VERSION_NAME
          VERSION_BUILD_KEY: VERSION_CODE
          VERSION_FIRST_PARENT: "true"
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.version }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "build-only" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
              exit 1
            fi

            unexpected_changes="$(
              git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
                | grep -Ev '^(\.github/workflows/desktop-release\.yml|scripts/(generate-release-notes|release-metadata)\.sh)$' \
                || true
            )"
            if [[ -n "${unexpected_changes}" ]]; then
              echo "The desktop version bump must be the final application change before release." >&2
              echo "Unexpected files changed after the bump:" >&2
              echo "${unexpected_changes}" >&2
              exit 1
            fi
          fi

      - name: Generate repository release notes
        if: inputs.mode != 'build-only'
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          ./scripts/generate-release-notes.sh \
            --from "${PREVIOUS_BUMP}" \
            --to "${CURRENT_BUMP}" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-history \
            --exclude "${EXCLUDE_COMMITS}" \
            > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No desktop repository release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.version }} desktop release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        if: inputs.mode != 'build-only'
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ steps.release.outputs.version }}-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    if: inputs.mode != 'dry-run'
    needs: metadata
    runs-on: windows-2022
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
      WEBVIEW2_VERSION: 1.0.4078.44

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          missing=()
          required_values=(
            LOCAL_PROPERTIES_BASE64
            SENTRY_AUTH_TOKEN
            SENTRY_DESKTOP_DSN
          )
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              missing+=("${value_name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required desktop release values: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            MDBLIST_CLIENT_ID
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build EXE installer
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseExe `
            :desktopSentry:sentryUploadSourceBundleJava `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace
          if ($LASTEXITCODE -ne 0) {
            throw "packageReleaseExe failed with exit code $LASTEXITCODE."
          }

      - name: Verify EXE installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $publishedExes = @(Get-ChildItem "composeApp\build\compose\release-exes" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($publishedExes.Count -ne 1) {
            throw "Expected exactly one EXE in composeApp\build\compose\release-exes, found $($publishedExes.Count)."
          }
          $outputDir = "composeApp\build\compose\release-installers"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $exePath = Join-Path $outputDir "NuvioCodeineXO-$env:RELEASE_VERSION.exe"
          Copy-Item $publishedExes[0].FullName $exePath -Force
          if ((Get-Item $exePath).Length -lt 50MB) {
            throw "The EXE installer is unexpectedly small: $((Get-Item $exePath).Length) bytes."
          }

          # The installer packs the release distributable as-is, so verify that payload.
          $appRoot = "composeApp\build\compose\binaries\main-release\app\NuvioCodeineXO"
          $appJar = Get-ChildItem $appRoot `
            -Recurse `
            -Filter "composeApp-desktop-*.jar" `
            | Select-Object -First 1
          if ($null -eq $appJar) {
            throw "The release distributable does not contain the desktop application JAR."
          }

          $jarEntries = & jar tf $appJar.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the desktop application JAR."
          }
          $requiredEntries = @(
            "native/windows/player_bridge.dll",
            "native/windows/libmpv-2.dll",
            "native/windows/WebView2Loader.dll",
            "native/windows/vcruntime140.dll",
            "native/windows/msvcp140.dll",
            "native/windows/runtime-files.txt",
            "native/windows/nuvio_engine.dll"
          )
          foreach ($entry in $requiredEntries) {
            if ($jarEntries -notcontains $entry) {
              throw "The desktop application JAR is missing $entry"
            }
          }

          $javaRuntimeJvm = Join-Path $appRoot "runtime\bin\server\jvm.dll"
          if (-not (Test-Path $javaRuntimeJvm)) {
            throw "The release distributable does not contain the bundled Java runtime."
          }
          $runtimeVersion = Select-String -Path (Join-Path $appRoot "runtime\release") -Pattern '^JAVA_VERSION=' | Select-Object -First 1

          $manifestPath = Join-Path $outputDir "NuvioCodeineXO-$env:RELEASE_VERSION-contents.txt"
          $appFiles = Get-ChildItem $appRoot -Recurse -File | Sort-Object FullName
          $nativeEntries = $jarEntries `
            | Where-Object { $_ -like "native/windows/*" } `
            | Sort-Object
          $manifest = [Collections.Generic.List[string]]::new()
          $manifest.Add("EXE=NuvioCodeineXO-$env:RELEASE_VERSION.exe")
          $manifest.Add("EXE_SHA256=$((Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant())")
          $manifest.Add("EXE_SIGNATURE_STATUS=$((Get-AuthenticodeSignature $exePath).Status)")
          $manifest.Add("JAVA_RUNTIME=$($runtimeVersion.Line)")
          $manifest.Add("APP_FILE_COUNT=$($appFiles.Count)")
          $manifest.Add("APP_JAR=$([IO.Path]::GetRelativePath($appRoot, $appJar.FullName).Replace('\', '/'))")
          $manifest.Add("")
          $manifest.Add("NATIVE_JAR_ENTRIES")
          foreach ($entry in $nativeEntries) {
            $manifest.Add($entry)
          }
          $manifest.Add("")
          $manifest.Add("APP_FILES")
          foreach ($file in $appFiles) {
            $relativePath = [IO.Path]::GetRelativePath($appRoot, $file.FullName).Replace('\', '/')
            $manifest.Add("$relativePath`t$($file.Length)")
          }
          $manifest | Set-Content $manifestPath -Encoding utf8

          Get-Item $exePath | Format-List Name, Length, LastWriteTime
          $manifest | Select-Object -First (8 + $nativeEntries.Count)

      - name: Upload EXE installer
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-windows-x64
          path: |
            composeApp/build/compose/release-installers/NuvioCodeineXO-${{ needs.metadata.outputs.version }}.exe
            composeApp/build/compose/release-installers/NuvioCodeineXO-${{ needs.metadata.outputs.version }}-contents.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create ${{ inputs.mode }} release
    if: inputs.mode != 'build-only' && inputs.mode != 'dry-run'
    needs:
      - metadata
      - windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.release_commit }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nuvio-desktop-${{ needs.metadata.outputs.version }}-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          release_assets=(
            "release/NuvioCodeineXO-${RELEASE_VERSION}.exe"
          )
          if [[ ! -s release/release-notes.md ]]; then
            echo "Release notes are missing." >&2
            exit 1
          fi

          : > release/SHA256SUMS.txt
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "Release asset is missing: ${asset}" >&2
              exit 1
            fi
            checksum="$(sha256sum "${asset}" | awk '{print $1}')"
            printf '%s  %s\n' "${checksum}" "$(basename "${asset}")" >> release/SHA256SUMS.txt
          done

          cat release/SHA256SUMS.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        run: |
          release_assets=(
            "release/NuvioCodeineXO-${RELEASE_VERSION}.exe"
            "release/SHA256SUMS.txt"
          )
          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_COMMIT}"
            --title "${RELEASE_VERSION}"
            --notes-file release/release-notes.md
          )
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create --repo "${GITHUB_REPOSITORY}" "${release_args[@]}" "${release_assets[@]}"
